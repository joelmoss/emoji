name: Release

# Push a tag like v0.1.0 to build, sign and notarize Emoji.app and create a DRAFT release with the DMG.
# Then edit the draft's notes on GitHub (they become the Sparkle update dialog) and publish it:
# publishing triggers appcast.yml, which adds appcast.xml.
# A failed run creates nothing: fix, delete the tag, retry.
# Needs these repository secrets (see README / `gh secret set`):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD      Developer ID Application certificate
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID   App Store Connect API key
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count, so it needs full history

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          NOTARIZE=1 VERSION="${TAG#v}" \
            NOTARY_ARGS="--key $RUNNER_TEMP/AuthKey.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID" \
            scripts/bundle.sh release
          rm "$RUNNER_TEMP/AuthKey.p8"

      # --generate-notes is only a starting point (commit/PR list): rewrite it into user-facing highlights.
      - name: Create draft release
        run: gh release create "$TAG" "Emoji-${TAG#v}.dmg" --draft --generate-notes
