name: Release

# Push a tag like v0.1.0 to build, sign, notarize and publish Emoji.app.
# Publish is the last step, so a failed run leaves no release: fix, delete the tag, retry.
# Needs these repository secrets (see README / `gh secret set`):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD      Developer ID Application certificate
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID   App Store Connect API key
#   SPARKLE_PRIVATE_KEY                                     from `generate_keys -x`; pairs with scripts/sparkle_public_key.txt
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number is the commit count, so it needs full history

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          NOTARIZE=1 VERSION="${TAG#v}" \
            NOTARY_ARGS="--key $RUNNER_TEMP/AuthKey.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID" \
            scripts/bundle.sh release
          rm "$RUNNER_TEMP/AuthKey.p8"

      # The feed lives on the release itself: the app reads .../releases/latest/download/appcast.xml.
      # generate_appcast keeps only the newest item, which is all Sparkle needs.
      - name: Sign appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir updates
          cp "Emoji-${TAG#v}.zip" updates/
          echo "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --full-release-notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            updates
          # generate_appcast only warns, and skips signing, when the key doesn't match the app's SUPublicEDKey.
          grep -q 'sparkle:edSignature' updates/appcast.xml || {
            echo "appcast is unsigned: SPARKLE_PRIVATE_KEY does not match scripts/sparkle_public_key.txt" >&2
            exit 1
          }

      - name: Publish
        run: gh release create "$TAG" "Emoji-${TAG#v}.zip" updates/appcast.xml --generate-notes
